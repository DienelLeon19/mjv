# Instalar en /etc/nginx/sites-available/sofia (incluido desde http {}).
# Presupuesto global para una VM de 1 GB; no confiar en cabeceras de IP del cliente.
limit_req_zone $server_name zone=sofia_requests:1m rate=3r/s;
limit_conn_zone $server_name zone=sofia_connections:1m;
server {
    listen 80;
    server_name nexrastudio.online;
    return 301 https://nexrastudio.online$request_uri;
}
server {
    listen 443 ssl;
    server_name nexrastudio.online;
    ssl_certificate /etc/nginx/ssl/sofia.pem;
    ssl_certificate_key /etc/nginx/ssl/sofia.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    root /opt/sofia/current/frontend/dist;
    index index.html;
    client_max_body_size 8k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    location = /api { return 404; }
    location /api/ {
        limit_req zone=sofia_requests burst=6 nodelay;
        limit_req_status 429;
        limit_conn sofia_connections 8;
        limit_conn_status 429;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 40s;
        proxy_send_timeout 10s;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        # No registrar consultas ni posibles datos personales en URLs de API.
        access_log off;
    }
    location /assets/ { try_files $uri =404; expires 1h; }
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
    location ~ /\. { deny all; }
}
